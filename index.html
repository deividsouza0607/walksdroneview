<script>
(() => {
  const root = document.getElementById("wdv-robo-widget");
  if (!root) return;
  const button = root.querySelector("#wdvAssistant");
  const hint = root.querySelector("#wdvHint");
  const panel = root.querySelector("#wdvSupportPanel");
  const close = root.querySelector("#wdvSupportClose");
  const form = root.querySelector("#wdvContactForm");
  const status = root.querySelector("#wdvStatus");
  const topic = root.querySelector("#wdvTopic");
  const themeToggle = root.querySelector("#wdvThemeToggle");

  if (themeToggle) {
    themeToggle.addEventListener("click", (event) => {
      event.stopPropagation();
      const purple = root.classList.toggle("wdv-purple-theme");
      themeToggle.textContent = purple ? "🟢 Verde" : "🟣 Roxo";
      themeToggle.setAttribute("aria-label", purple ? "Trocar para tema verde neon" : "Trocar para tema roxo neon");
      themeToggle.title = purple ? "Trocar para verde neon" : "Trocar para roxo neon";
    });
  }

  function setOpen(open) {
    button.classList.toggle("is-robot", open);
    button.setAttribute("aria-pressed", String(open));
    button.setAttribute("aria-label", open ? "Fechar suporte e voltar ao drone" : "Abrir opções de suporte");
    panel.hidden = !open;
    if (hint) hint.textContent = open
      ? "Sou seu assistente! Escolha uma opção de suporte."
      : "Olá! Toque no drone para ver minha transformação.";
  }

  button.addEventListener("click", () => setOpen(!button.classList.contains("is-robot")));
  close.addEventListener("click", () => setOpen(false));

  root.querySelectorAll(".wdv-option").forEach(option => {
    option.addEventListener("click", () => {
      topic.value = option.dataset.topic;
      root.querySelectorAll(".wdv-option").forEach(item => item.classList.remove("selected"));
      option.classList.add("selected");
      root.querySelector("#wdvDetails").focus();
    });
  });

  form.addEventListener("submit", event => {
    event.preventDefault();
    if (!form.reportValidity()) return;
    const data = new FormData(form);
    const message = `CHAMADO DE SUPORTE — WALKS DRONE VIEW\n\nNome: ${data.get("name")}\nWhatsApp: ${data.get("phone")}\nAssunto: ${data.get("topic")}\n\nMensagem:\n${data.get("details")}`;
    const subject = encodeURIComponent("Solicitação de suporte - Walks Drone View");
    const body = encodeURIComponent(message);
    status.textContent = "Abrindo seu aplicativo de e-mail com o chamado endereçado a walksdroneview@gmail.com. Confirme o envio por lá.";
    status.classList.add("show");
    window.location.href = `mailto:walksdroneview@gmail.com?subject=${subject}&body=${body}`;
  });
})();
</script>

<div class="box-home" id="home">

    <style>
        .box-home {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 700px;
            margin: 30px auto;
            margin-bottom: -90px;
            overflow: hidden;
            border-radius: 15px;
            background: #e903c329;
        }

        .container-home {
            display: flex;
            width: 100%;
            height: 100%;
            margin-top: 0;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .slide.ativo {
            display: block;
            animation: aparecer 0.7s ease;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @keyframes aparecer {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        /* Setas */
        .box-home .seta {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            font-size: 28px;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 8px;
            z-index: 10;
        }

        .box-home .seta:hover {
            background: rgba(0, 0, 0, 0.85);
        }

        .box-home .anterior {
            left: 15px;
        }

        .box-home .proximo {
            right: 15px;
        }

        /* Indicadores */
        .indicadores {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 10;
        }

        .ponto {
            width: 12px;
            height: 12px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: #aaa;
            cursor: pointer;
        }

        .ponto.ativo {
            background: #fff;
            transform: scale(1.2);
        }

        /* Celular */
        @media (max-width: 415px) {
            .box-home {
                margin-bottom: -190px !important;
                height: 220px;
                margin: 10px auto;
                border-radius: 8px;
background-color: #c084fc;
            }
            
            .box-home .seta {
                font-size: 20px;
                padding: 7px 11px;
            }

            .box-home .anterior {
                left: 8px;
            }

            .box-home .proximo {
                right: 8px;
            }
        }
    </style>

    <div class="container-home">

        <!-- Slide 1 -->
        <div class="slide ativo">
            <img src="./src/img/destaque2.png" alt="Slide 1">
        </div>

        <!-- Slide 2 -->
        <div class="slide">
            <img src="./src/img/Banner Atacarejo Rancho dos Amigos.png" alt="Slide 2">
        </div>

        <!-- Slide 3
        <div class="slide">
            <img src="/src/img/destaque2.png" alt="Slide 3">
        </div>
    -->
    </div>

    <!-- Setas -->
    <button class="seta anterior" type="button"
        aria-label="Slide anterior">&#10094;</button>

    <button class="seta proximo" type="button"
        aria-label="Próximo slide">&#10095;</button>

    <!-- Indicadores -->
    <div class="indicadores">
        <button class="ponto ativo" type="button"
            aria-label="Ir para slide 1"></button>
        <button class="ponto" type="button"
            aria-label="Ir para slide 2"></button>
        <button class="ponto" type="button"
            aria-label="Ir para slide 3"></button>
    </div>

    <script>
        (() => {
            const box = document.querySelector('#home');
            if (!box) return;

            const slides = box.querySelectorAll('.slide');
            const pontos = box.querySelectorAll('.ponto');
            const anterior = box.querySelector('.anterior');
            const proximo = box.querySelector('.proximo');

            let atual = 0;

// Troca automática dos slides a cada 3 segundos
setInterval(() => {
    mostrarSlide(atual + 1);
}, 4000);




            function mostrarSlide(indice) {
                atual = (indice + slides.length) % slides.length;

                slides.forEach((slide, i) => {
                    slide.classList.toggle('ativo', i === atual);
                });

                pontos.forEach((ponto, i) => {
                    ponto.classList.toggle('ativo', i === atual);
                });
            }

            anterior.addEventListener('click', () => {
                mostrarSlide(atual - 1);
            });

            proximo.addEventListener('click', () => {
                mostrarSlide(atual + 1);
            });

            pontos.forEach((ponto, i) => {
                ponto.addEventListener('click', () => {
                    mostrarSlide(i);
                });
            });
        })();
    </script>

</div>
