<style>
.whatsapp-float {
  position: fixed;
  width: 62px;
  height: 62px;
  right: 25px;
  bottom: 25px;
  background: #25D366;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 5px 18px rgba(0,0,0,.30);
  z-index: 999999;
  text-decoration: none;
  transition: .3s ease;
  animation: whatsappPulse 2s infinite;
}

.whatsapp-float svg {
  width: 36px;
  height: 36px;
}

.whatsapp-float:hover {
  transform: scale(1.12);
  background: #128C7E;
}

@keyframes whatsappPulse {
  0% { box-shadow: 0 0 0 0 rgba(37,211,102,.5); }
  70% { box-shadow: 0 0 0 13px rgba(37,211,102,0); }
  100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); }
}

@media(max-width:600px) {
  .whatsapp-float {

    height: 55px;
    right: 15px;
    bottom: 18px;
  }

  .whatsapp-float svg {

}
